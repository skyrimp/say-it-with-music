const $=id=>document.getElementById(id);
const reduce=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('swm_'+k))??d}catch{return d}};
let favs=load('favs',[]),sent=load('sent',[]),notes=load('notes',{}),custom=load('custom',[]),view='home',currentCat='all',search='',order='default',onlyFav=false,expanded=36;
function save(){try{localStorage.setItem('swm_favs',JSON.stringify(favs));localStorage.setItem('swm_sent',JSON.stringify(sent));localStorage.setItem('swm_notes',JSON.stringify(notes));localStorage.setItem('swm_custom',JSON.stringify(custom))}catch{toast('Impossible d’enregistrer localement : stockage indisponible')}}
const categories=DATA.categories;
const allSongs=()=>[...DATA.songs,...custom];
const song=id=>allSongs().find(s=>s.id===id);
const cat=id=>categories.find(c=>c.id===id)||categories[0];
const songlabel=s=>`${s.artist} — ${s.title}`;
function toast(msg){const el=$('toast');el.innerText=msg;el.className='toast';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.className='',2900)}
function go(v,id){view=v;if(id)currentCat=id;if(v==='explore'&&!id)currentCat='all';if(v!=='explore')search='';expanded=36;render();scrollTo({top:0,behavior:'instant'})}
function catTile(c){return `<button class="tile" style="--tilebg:${c.color}28;--accent:${c.color}" data-action="cat" data-id="${c.id}"><div class="emo">${c.icon}</div><div><div class="dots"><span></span><span></span></div><strong>${esc(c.name)}</strong><small>${allSongs().filter(s=>s.category===c.id).length} chansons</small></div></button>`}
function genre(s){return esc((s.genre||'R&B').split(' · ')[0].split(' — ')[0].slice(0,38))}
function card(s){let c=cat(s.category),f=favs.includes(s.id);return `<article class="songcard"><div class="cover" style="--tone:${c.color}b0">${c.icon}</div><div class="songinfo"><h3>${esc(s.title)}</h3><div class="artist">${esc(s.artist)}</div><p>${esc(s.meaning||s.description)}</p><div class="cardactions"><button class="btn miniBtn line" data-action="detail" data-id="${s.id}">Voir le sens</button><button class="btn miniBtn primary" data-action="spotify" data-id="${s.id}" aria-label="${s.direct?'Écouter':'Rechercher'} ${esc(s.title)} sur Spotify">♫ Spotify</button><button class="iconbtn ${f?'liked':''}" data-action="fav" data-id="${s.id}" aria-label="${f?'Retirer des favoris':'Ajouter aux favoris'}">${f?'♥':'♡'}</button></div></div></article>`}
function home(){let featured=['Ne-Yo','Juls & Odeal','Cleo Sol','Daniel Caesar'];let arr=featured.map(art=>allSongs().find(s=>s.artist.startsWith(art))).filter(Boolean);return `<section class="hero"><div class="mini">♥ · À deux, même à distance</div><h1>Les mots manquent.<br><em>Pas les chansons.</em></h1><p>Une dispute, un manque, un sourire… Trouve le morceau qui dit ce que tu ressens à ta place.</p><div class="heroactions"><button class="btn primary" data-action="goexplore">Trouver une chanson ↗</button><button class="btn soft" data-action="surprise">✦ Surprends-moi</button></div></section><div class="sectionheading"><div><h2>Pour quel moment ?</h2><p>Choisis ce que tu voudrais lui dire.</p></div><button class="linkbtn" data-action="goexplore">Voir les 20 →</button></div><div class="tiles">${['c14','c16','c12','c11','c19','c20'].map(id=>catTile(cat(id))).join('')}</div><div class="sectionheading"><div><h2>Quelques idées pour vous</h2><p>Des morceaux qui parlent à ta place.</p></div></div><div class="songlist">${arr.map(card).join('')}</div><div class="aside"><span class="icon">🔒</span><div><strong>Une bibliothèque rien qu’à toi</strong><p>Favoris, notes et historique restent sur cet appareil. Pas de compte ni de données de votre couple à transmettre.</p></div></div>`}
function explore(){let arr=allSongs().filter(s=>(currentCat==='all'||s.category===currentCat)&&reduce(`${s.title} ${s.artist} ${s.description} ${cat(s.category).name}`).includes(reduce(search)));if(order==='az')arr.sort((a,b)=>a.title.localeCompare(b.title,'fr'));if(order==='fav')arr.sort((a,b)=>Number(favs.includes(b.id))-Number(favs.includes(a.id)));if(order==='sent')arr.sort((a,b)=>Number(sent.includes(b.id))-Number(sent.includes(a.id)));let shown=arr.slice(0,expanded);return `<div class="screenhead"><div class="smallcaps">Tes émotions · tes chansons</div><h1>Explore les moments.</h1><p>125 titres d'origine · 20 concepts pour votre relation.</p></div><label class="searchbox"><span>⌕</span><input id="search" type="search" placeholder="Chanson, artiste, émotion…" value="${esc(search)}" autocomplete="off"></label><div class="pillbox"><button class="pill ${currentCat==='all'?'on':''}" data-action="cat" data-id="all">Tout · ${allSongs().length}</button>${categories.map(c=>`<button class="pill ${currentCat===c.id?'on':''}" data-action="cat" data-id="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('')}</div><div class="resultsbar"><span>${arr.length} chanson${arr.length===1?'':'s'}</span><select id="sort" aria-label="Trier les chansons"><option value="default" ${order==='default'?'selected':''}>Ordre original</option><option value="az" ${order==='az'?'selected':''}>Titre A à Z</option><option value="fav" ${order==='fav'?'selected':''}>Favoris d'abord</option><option value="sent" ${order==='sent'?'selected':''}>Déjà envoyées</option></select></div><div class="songlist">${shown.map(card).join('')}</div>${arr.length===0?'<div class="empty"><span>♫</span><b>Aucun résultat</b>Essaie une autre émotion ou un autre artiste.</div>':''}${arr.length>shown.length?`<button class="btn line showMore" data-action="more">Voir ${Math.min(36,arr.length-shown.length)} autres chansons ↓</button>`:''}`}
function favourites(){let arr=allSongs().filter(s=>favs.includes(s.id));return `<div class="screenhead"><div class="smallcaps">Ton petit coffre au trésor</div><h1>Mes favoris ♡</h1><p>Tes chansons préférées, pour les retrouver en deux secondes.</p></div>${arr.length?`<div class="songlist">${arr.map(card).join('')}</div>`:`<div class="empty"><span>♡</span><b>Aucun favori pour le moment</b>Touche le cœur d'une chanson pour la garder ici.<p><button class="btn primary" data-action="goexplore">Explorer les chansons →</button></p></div>`}`}
function profile(){return `<div class="screenhead"><div class="smallcaps">Ton espace privé</div><h1>Votre histoire, tes choix.</h1><p>Personnalise ta collection sans compte et sans abonnement.</p></div><div class="profilebox"><div class="statrow"><div class="stat"><b>${allSongs().length}</b><small>chansons</small></div><div class="stat"><b>${favs.length}</b><small>favoris</small></div><div class="stat"><b>${sent.length}</b><small>envoyées</small></div></div></div><div class="settingrow"><div><strong>Ajouter une chanson</strong><p>Ton morceau, sa signification, sa catégorie.</p></div><button class="btn primary miniBtn" data-action="add">+ Ajouter</button></div><div class="settingrow"><div><strong>Déjà envoyées</strong><p>Retrouve les morceaux que tu lui as partagés.</p></div><button class="btn line miniBtn" data-action="showsent">Voir (${sent.length})</button></div><div class="settingrow"><div><strong>Sauvegarder mes données</strong><p>Export JSON de tes favoris, notes et chansons.</p></div><button class="btn line miniBtn" data-action="export">Exporter</button></div><div class="settingrow"><div><strong>Restaurer une sauvegarde</strong><p>Si tu changes d'appareil ou réinstalles l'app.</p></div><button class="btn line miniBtn" data-action="import">Importer</button><input id="backup" hidden type="file" accept="application/json,.json"></div><div class="aside"><span class="icon">🛡️</span><div><strong>Respect de ta vie privée</strong><p>Les informations sont conservées dans le stockage de ce navigateur, sans serveur de compte. Si tu effaces les données du navigateur, elles seront perdues : pense à exporter une sauvegarde.</p><p>Si tu publies la page sur un hébergement gratuit, l'interface et le catalogue sont publics, mais tes notes locales ne sont pas envoyées à l'hébergeur par l'application.</p></div></div><p class="note">Spotify s'ouvre séparément ; une connexion Spotify n'est pas requise pour utiliser la bibliothèque. Les liens non vérifiés ouvrent une recherche, pas une piste inventée.</p>`}
function render(){document.querySelectorAll('.navbtn').forEach(b=>{b.classList.toggle('on',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});let main=$('screen');const ss=document.activeElement&&document.activeElement.id==='search'?{st:document.activeElement.selectionStart,en:document.activeElement.selectionEnd}:null;main.innerHTML=view==='home'?home():view==='explore'?explore():view==='favs'?favourites():profile();if(ss){const inp=$('search');if(inp){inp.focus({preventScroll:true});try{inp.setSelectionRange(ss.st,ss.en)}catch{}}}}
function detail(s){let c=cat(s.category),f=favs.includes(s.id),isSent=sent.includes(s.id);const note=notes[s.id]||'';const danger=s.warning?`<div class="warning">⚠ Certaines paroles peuvent avoir une tonalité différente (tristesse, possessivité, reproches ou rupture). Vérifie-les avant de dédier cette chanson.</div>`:'';return `<div class="modalbg" id="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="sheetheader"><div class="detailcover" style="background:linear-gradient(135deg,${c.color}88,#46314b)">${c.icon}</div><button class="iconbtn" data-action="close" aria-label="Fermer">✕</button></div><div class="sublabel" style="color:${c.color}">${esc(c.name)}</div><h2 id="detailTitle">${esc(s.title)}</h2><div style="color:#d6c2d4;font-size:14px">${esc(s.artist)}</div><p class="tag">${genre(s)}</p><div class="sublabel" style="margin-top:11px">Ce que tu lui dis avec cette chanson</div><div class="detaildesc">${esc(s.meaning||s.description)}</div>${danger}<div class="detailactions"><button class="btn primary wide" data-action="spotify" data-id="${s.id}">♫ ${s.direct?'Ouvrir la chanson':'Rechercher la chanson'} sur Spotify ↗</button><button class="btn line" data-action="fav" data-id="${s.id}">${f?'♥ En favori':'♡ Ajouter aux favoris'}</button><button class="btn line" data-action="sent" data-id="${s.id}">${isSent?'✓ Déjà envoyée':'✉ Marquer envoyée'}</button><button class="btn line" data-action="copy" data-id="${s.id}">⧉ Copier</button><button class="btn line" data-action="share" data-id="${s.id}">↗ Partager</button></div><div class="field"><label for="songnote">Mes notes personnelles (sur cet appareil)</label><textarea id="songnote" data-id="${s.id}" placeholder="Ex. : à envoyer après notre appel du soir…">${esc(note)}</textarea></div>${s.custom?`<button class="btn line" data-action="delete" data-id="${s.id}">Supprimer cette chanson personnelle</button>`:''}<p class="note">${s.direct?'Un lien vers une piste Spotify est fourni ; sa disponibilité dépend du pays et du catalogue.':'Le bouton ouvre une recherche Spotify : sélectionne la bonne version du morceau.'}</p></div></div>`}
function openDetail(id){let s=song(id);if(s){$('modal').innerHTML=detail(s);document.body.style.overflow='hidden';$('modal').querySelector('[data-action="close"]').focus()}}
function closeModal(){$('modal').innerHTML='';document.body.style.overflow=''}
function addSheet(){let opts=categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('modal').innerHTML=`<div class="modalbg" id="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="addTitle"><div class="sheetheader"><div><div class="sublabel">Pour enrichir votre histoire</div><h2 id="addTitle">Ajouter une chanson ♡</h2></div><button class="iconbtn" data-action="close">✕</button></div><form id="addForm"><div class="field"><label for="artist">Artiste</label><input id="artist" name="artist" required maxlength="120" placeholder="Ex. : Odeal"></div><div class="field"><label for="title">Titre</label><input id="title" name="title" required maxlength="120" placeholder="Ex. : Soh-Soh"></div><div class="field"><label for="categ">Pour quel moment ?</label><select id="categ" name="category">${opts}</select></div><div class="field"><label for="meaning">Ce que ça veut dire pour elle</label><textarea id="meaning" name="meaning" required maxlength="600" placeholder="Ce que je veux lui faire comprendre…"></textarea></div><div class="field"><label for="songurl">Lien Spotify direct (facultatif)</label><input id="songurl" name="songurl" placeholder="https://open.spotify.com/track/…"></div><button type="submit" class="btn primary" style="width:100%">Enregistrer ma chanson</button></form></div></div>`;document.body.style.overflow='hidden';$('artist').focus()}
function spotify(s){window.open(s.spotify,'_blank','noopener,noreferrer')}
function togg(arr,id){const n=arr.indexOf(id);if(n<0)arr.push(id);else arr.splice(n,1);save();render();if($('modal').firstElementChild)openDetail(id)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copié !')}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copié !')}catch{toast('Copie non prise en charge ici')}t.remove()}}
function exportData(){let data={version:1,exportedAt:new Date().toISOString(),favs,sent,notes,custom};let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SayIt-Sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Sauvegarde créée')}
function showsent(){let ids=sent;let arr=allSongs().filter(s=>ids.includes(s.id));$('modal').innerHTML=`<div class="modalbg" id="backdrop"><div class="sheet" role="dialog" aria-modal="true"><div class="sheetheader"><h2>Déjà envoyées ✉</h2><button class="iconbtn" data-action="close">✕</button></div>${arr.length?arr.map(s=>`<div class="settingrow"><div><strong>${esc(s.title)}</strong><p>${esc(s.artist)}</p></div><button class="btn line miniBtn" data-action="detail" data-id="${s.id}">Voir</button></div>`).join(''):'<p>Aucune chanson marquée comme envoyée.</p>'}</div></div>`;document.body.style.overflow='hidden'}
document.addEventListener('click',async e=>{
const nav=e.target.closest('[data-view]');if(nav){go(nav.dataset.view);return}
const b=e.target.closest('[data-action]');if(!b){if(e.target.id==='backdrop')closeModal();return};let id=b.dataset.id,action=b.dataset.action;
if(action==='cat'){currentCat=id;view='explore';search='';expanded=36;render();scrollTo({top:0,behavior:'instant'});return}
if(action==='goexplore'){go('explore');return}
if(action==='surprise'){openDetail(allSongs()[Math.floor(Math.random()*allSongs().length)].id);return}
if(action==='detail'){openDetail(id);return}
if(action==='close'){closeModal();return}
if(action==='spotify'){let s=song(id);if(s)spotify(s);return}
if(action==='fav'){togg(favs,id);toast(favs.includes(id)?'Ajouté aux favoris ♥':'Retiré des favoris');return}
if(action==='sent'){togg(sent,id);toast(sent.includes(id)?'Marquée comme envoyée':'Marque retirée');return}
if(action==='copy'){let s=song(id);if(s)await copy(`${s.artist} — ${s.title}
${s.meaning||s.description}
${s.spotify}`);return}
if(action==='share'){let s=song(id);if(!s)return;const data={title:songlabel(s),text:`Cette chanson me fait penser à nous ♡
${s.artist} — ${s.title}`,url:s.spotify};if(navigator.share)try{await navigator.share(data)}catch{}else await copy(data.text+'\n'+data.url);return}
if(action==='more'){expanded+=36;render();return}
if(action==='add'){addSheet();return}
if(action==='delete'){if(!confirm('Supprimer cette chanson personnelle ?'))return;custom=custom.filter(s=>s.id!==id);favs=favs.filter(x=>x!==id);sent=sent.filter(x=>x!==id);delete notes[id];save();closeModal();render();toast('Chanson supprimée');return}
if(action==='export'){exportData();return}
if(action==='import'){$('backup')?.click();return}
if(action==='showsent'){showsent();return}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;render()}if(e.target.id==='songnote'){notes[e.target.dataset.id]=e.target.value;save()}});
document.addEventListener('change',async e=>{if(e.target.id==='sort'){order=e.target.value;render()}if(e.target.id==='backup'){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.favs)||!Array.isArray(x.sent)||!Array.isArray(x.custom)||typeof x.notes!=='object'||!x.notes||Array.isArray(x.notes))throw Error('Données incompatibles');if(!confirm('Restaurer cette sauvegarde ? Elle remplacera tes favoris, notes et chansons personnelles.'))return;favs=x.favs.filter(x=>typeof x==='string');sent=x.sent.filter(x=>typeof x==='string');notes=x.notes;custom=x.custom.filter(s=>s.id&&s.artist&&s.title&&s.category&&typeof s.spotify==='string'&&/^https:\/\/open\.spotify\.com\/(track|search)\//.test(s.spotify));save();render();toast('Sauvegarde restaurée')}catch{toast('Fichier de sauvegarde non reconnu')}}});
document.addEventListener('submit',e=>{if(e.target.id!=='addForm')return;e.preventDefault();let fd=new FormData(e.target),artist=String(fd.get('artist')||'').trim(),title=String(fd.get('title')||'').trim(),meaning=String(fd.get('meaning')||'').trim(),category=fd.get('category'),url=String(fd.get('songurl')||'').trim();if(!artist||!title||!meaning)return;let direct=/^https:\/\/open\.spotify\.com\/track\/[A-Za-z0-9]+(?:\?.*)?$/.test(url);if(url&&!direct){toast('Lien non reconnu : recherche Spotify utilisée');url=''}let searchUrl='https://open.spotify.com/search/'+encodeURIComponent(title+' '+artist);custom.push({id:'mine'+Date.now().toString(36),artist,title,meaning,description:'Chanson personnelle. '+meaning,genre:'Mon choix',category,spotify:direct?url:searchUrl,direct,warning:false,custom:true});save();closeModal();go('explore',category);toast('Ta chanson est enregistrée !')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('random').addEventListener('click',()=>openDetail(allSongs()[Math.floor(Math.random()*allSongs().length)].id));
render();

</script></body></html>
