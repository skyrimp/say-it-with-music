/* V3 refinements: editorial artwork, dedicated sharing, playlist building. */
html{overscroll-behavior-y:none}
body{letter-spacing:.002em}
.app{padding-bottom:24px}
button,select,a,input,textarea{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.detailcover{width:130px;height:130px;min-width:130px;border-radius:20px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,var(--cv,#6a4967),#2d263d);color:#fff9;border:1px solid #ffffff22}
.detailcover .ico{width:48px;height:48px;stroke-width:1.2}.detailcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.detailhero{display:flex;gap:18px;align-items:center;margin:15px 0 19px}.detailhero h2{font-family:Georgia,serif;font-size:clamp(22px,5.3vw,34px);margin:0 0 5px;font-weight:500;line-height:1.12;overflow-wrap:anywhere}.detailhero p{color:var(--muted);font-size:13px;margin:0 0 10px}.detailhero .cover{min-width:92px;width:92px;height:92px;flex-basis:92px}.detailhero .chips{margin-top:12px}
.sheet{padding:21px 20px 29px;max-height:min(90svh,900px);overflow:auto;overscroll-behavior:contain;max-width:580px;width:100%;border-radius:28px 28px 0 0}
.sheet .field{margin-top:11px}.sheet .panel{margin:12px 0}.sheet .panel h3{font-size:18px;display:flex;gap:8px;align-items:center}.sheet .panel p{font-size:12.5px;line-height:1.55;color:var(--fg)}
.sheet .sheethead{padding:0 0 9px;border-bottom:1px solid var(--line)}
.sheet .btnline{gap:8px;margin-bottom:2px}.sheet .btn{flex:1;min-width:136px}
.notice{display:flex;align-items:flex-start;gap:11px;padding:12px;border:1px solid #705e42;border-radius:14px;background:#4a382933;color:#f6d8af;margin:12px 0;font-size:12px;line-height:1.55}.notice .ico{flex:0 0 19px;margin-top:1px}.notice strong{font-size:12px;display:block}.notice p{margin:0;color:inherit;font-size:12px;line-height:1.6}
.online{white-space:nowrap;min-width:0;font-size:10px}
.btnline{display:flex;flex-wrap:wrap;gap:10px}.btnline>*{flex:0 1 auto}
.panel h3>.ico{vertical-align:middle;width:21px;height:21px}
.panel .field{margin-top:11px}.panel .btn{max-width:100%}
.seeditem .cover{width:50px;height:50px;flex:0 0 50px}
.seeditem .cover .ico{height:22px;width:22px}
.selectsong{min-width:185px;max-width:240px;display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:13px;border:1px solid var(--line);background:#2a2032;color:var(--fg);text-align:left;font-size:11px;scroll-snap-align:start}
.selectsong span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:700}.selectsong small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;margin-top:3px;color:var(--muted)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#ffffff06;border-radius:14px;padding:12px;margin:12px 0}.switchrow input{accent-color:#eab6d3;width:19px;height:19px}
.empty{background:linear-gradient(135deg,#2e223434,#1b17222a)}
.songcard{overflow:hidden;min-height:89px}
.songdetails{display:block;flex:1;min-width:0}
.songdetails .chips{overflow-x:auto;flex-wrap:nowrap;max-width:100%;scrollbar-width:none}
.songdetails .chips::-webkit-scrollbar{display:none}
.songcard .iconbtn{padding:7px}
.songcard .iconbtn:last-child{color:var(--pink)}
.songcard .cover{width:66px;height:66px;flex:0 0 66px}
.bottomnav{box-shadow:0 -9px 25px #0005;z-index:50}
.bottomnav button{min-width:0}
.bottomnav button .ico{width:21px;height:21px}
.hero:after{font-family:Georgia,serif}
.stat,.concept,.panel,.songcard{box-shadow:0 5px 26px #08050810}
.panel.surprise{background:radial-gradient(circle at top right,#a85d9950,transparent 55%),var(--surface)}
.sectionhead{align-items:flex-start}
.sectionhead h2{line-height:1.2}
.field textarea{min-height:116px}
.field .searchbar{align-items:stretch}
#studioName{font-size:12px}

function ico(name,sz){return `<svg class="ico${sz?' '+sz:''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]||iconPaths.music}</svg>`}
function safeSpotifyURL(s){const r=state.resolved?.[s.id];if(r?.id) return 'https://open.spotify.com/track/'+r.id;const match=String(s.spotify||'').match(/^https:\/\/open\.spotify\.com\/track\/([a-zA-Z0-9]{22})(?:\b|$)/);return match?'https://open.spotify.com/track/'+match[1]:'https://open.spotify.com/search/'+encodeURIComponent(s.title+' '+s.artist)}
function coverURL(s){return state.resolved?.[s.id]?.art||s.art||''}
function coverHTML(s,cls='cover'){let url=coverURL(s);return `<div class="${cls}" style="--cv:${esc(byCat(s.category)?.color||'#594366')}" data-cover-id="${esc(s.id)}">${ico('disc')}${url?`<img alt="Album artwork for ${esc(s.title)}" loading="lazy" src="${esc(url)}" onerror="this.remove()"/>`:''}</div>`}
function fav(id){return state.favorites.includes(id)}
function songCard(s,opts={}){const explicit=s.caution&&s.meaningStatus!=='style';const m=s.source==='discovery'?'Style only':s.source==='spotify'?'Spotify result':s.meaningStatus==='editorial'?'Curated meaning':'Mood pick';const saved=state.savedDiscoveries.some(x=>x.id===s.id)||s.source!=='spotify';return `<article class="songcard" data-song="${esc(s.id)}">${coverHTML(s)}<div class="songdetails"><strong>${esc(s.title)}</strong><small>${esc(s.artist)}</small><div class="chips"><span class="chip">${esc(s.genreGroup||s.genre||'Music')}</span><span class="chip">${esc(s.mood||'Vibe')}</span>${explicit?`<span class="chip warn" title="Specific interpretation note">Context note</span>`:''}${s.source==='spotify'?'<span class="chip fresh">Spotify</span>':''}</div>${s.matchNote?`<small class="matchnote">${esc(s.matchNote)}</small>`:''}</div><div class="songactions"><button class="iconbtn ${fav(s.id)?'fav':''}" data-action="favorite" data-id="${esc(s.id)}" aria-label="${fav(s.id)?'Remove favorite':'Add favorite'}">${ico('heart')}</button><button class="iconbtn" data-action="detail" data-id="${esc(s.id)}" aria-label="Song details">${ico('arrow-right')}</button></div></article>`}
function sectionHead(title,description,action){return `<div class="sectionhead"><div><h2>${esc(title)}</h2>${description?`<p>${esc(description)}</p>`:''}</div>${action||''}</div>`}
function categoryCard(c){const count=allSongs().filter(s=>s.category===c.id).length;return `<button class="concept" style="--accent:${esc(c.color)};--card:${esc(c.color)}15" data-action="category" data-id="${esc(c.id)}"><span class="concepticon">${ico(c.icon)}</span><span><strong>${esc(c.name)}</strong><small>${esc(c.description)}</small><span class="count">${count} curated songs</span></span></button>`}
const tabs=[['home','Home','home'],['discover','Discover','compass'],['mix','Mix Lab','wave'],['saved','Saved','bookmark'],['you','You','user']];
function header(){return `<header class="topbar"><div class="logo"><span class="logomark">${ico('heart')}</span><span><strong>SAY IT WITH MUSIC</strong><small>EVERY MOMENT HAS A SOUNDTRACK</small></span></div><div class="topactions"><span class="online">${ico(session?.access?'check':'music')}${session?.access?'Spotify ready':'Personal library'}</span><button class="roundbtn" data-action="navigate" data-id="you" aria-label="Settings">${ico('settings')}</button></div></header>`}
function nav(){return `<nav class="bottomnav" aria-label="Primary navigation">${tabs.map(([id,label,glyph])=>`<button data-action="navigate" data-id="${id}" class="${runtime.tab===id?'active':''}" aria-current="${runtime.tab===id?'page':'false'}">${ico(glyph)}<span>${label}</span></button>`).join('')}</nav>`}
function home(){const broad=CATS.filter(c=>!/^c/.test(c.id));const personal=CATS.filter(c=>/^c/.test(c.id));return `${header()}<section class="hero"><div class="eyebrow">WELCOME TO YOUR MUSIC WORLD</div><h1>Feel something.<br><i>Find your song.</i></h1><p>Discover music for the moment you're living — or the message you want to send.</p><div class="btnline"><button class="btn" data-action="navigate" data-id="discover">${ico('compass')} Explore music</button><button class="btn secondary" data-action="navigate" data-id="mix">${ico('wave')} Open Mix Lab</button></div></section><section class="section">${sectionHead('For this moment','Music for every side of life')}<div class="gridconcept">${broad.map(categoryCard).join('')}</div></section><section class="section">${sectionHead('Say it with a song','Love, distance, friendship and everything between',`<button class="textbtn" data-action="allConcepts">See all</button>`)}<div class="gridconcept">${(runtime.showAllConcepts?personal:personal.slice(0,6)).map(categoryCard).join('')}</div></section><section class="section">${sectionHead('Your next favorite','An easy way to go beyond the original 125 songs')}<div class="panelgrid"><div class="panel surprise"><div class="eyebrow">SURPRISE ME</div><h3>Something unexpected.</h3><p>Pick an unexpected track for your current mood.</p><div class="field" style="margin:12px 0"><label for="surpriseMood">Choose a mood</label><select id="surpriseMood">${['All','Feel good','Confidence','Calm','Healing','Romantic','Longing','Chill','Joyful'].map(m=>`<option ${runtime.surpriseMood===m?'selected':''}>${m}</option>`).join('')}</select></div><button class="btn" data-action="surprise">${ico('shuffle')} Find a song</button></div><div class="panel"><div class="eyebrow">PLAYLIST STUDIO</div><h3>Build the perfect mix.</h3><p>Create a concept-based set and export confirmed tracks to Spotify.</p><button class="btn secondary" data-action="playlistStudio">${ico('layers')} Build a playlist</button></div></div></section><section class="section">${sectionHead('A few curated favorites','Original song meanings have context notes where needed')}<div class="songlist">${DB.songs.filter(s=>s.source==='curated').slice(33,39).map(songCard).join('')}</div></section><p class="footnote">Spotify content and album artwork appear only after a verified match. Your private notes stay on this device.</p>`}
function selectedOptions(items,value){return items.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function discover(){const genreList=['All',...new Set(allSongs().map(x=>x.genreGroup||x.genre).filter(Boolean))].sort(),moods=['All',...new Set(allSongs().map(s=>s.mood).filter(Boolean))].sort(),energy=['All','Low','Medium','High'];return `${header()}<div class="pagehead"><div class="eyebrow">DISCOVER</div><h1>Find your sound.</h1><p>Explore the original 125 and ${DB.songs.length-125} new style-based discovery picks. Spotify search expands the choices after connecting.</p></div><div class="filters"><div class="field"><label for="discQuery">Song, artist, emotion or situation</label><div class="searchbar"><input id="discQuery" type="search" value="${esc(runtime.query)}" placeholder="Try: happy, calm, miss you, neo-soul…"/><button class="btn compact" data-action="applySearch">${ico('search')} Search</button></div></div><div class="filters-grid" style="margin-top:14px"><div class="field"><label for="genreFilter">Genre</label><select id="genreFilter">${selectedOptions(genreList,runtime.genre)}</select></div><div class="field"><label for="moodFilter">Mood</label><select id="moodFilter">${selectedOptions(moods,runtime.mood)}</select></div><div class="field"><label for="energyFilter">Energy</label><select id="energyFilter">${selectedOptions(energy,runtime.energy)}</select></div><div class="field"><label for="sourceFilter">Collection</label><select id="sourceFilter">${[['all','All music'],['curated','Original 125'],['discovery','New style picks'],['saved','My saved songs']].map(x=>`<option value="${x[0]}" ${x[0]===runtime.scope?'selected':''}>${x[1]}</option>`).join('')}</select></div></div><div class="btnline" style="margin-top:13px"><button class="btn secondary compact" data-action="resetFilters">Clear filters</button><button class="btn secondary compact" data-action="liveSearch">${ico('music')} Search Spotify catalog</button></div></div><div id="discoverResults">${discoverResults()}</div>${session?.access?`<section class="section"><div class="panel"><h3>Music Radar · niche finds</h3><p>Search style-focused artists beyond the saved library, without claiming their lyrics have been reviewed.</p><button class="btn secondary" data-action="musicRadar">${ico('sparkles')} Discover niche sounds</button><div id="radarResults">${runtime.radarResults.length?listWithHeader(runtime.radarResults,'Spotify discoveries'):''}</div></div></section>`:`<div class="panel"><h3>${ico('music')} Unlock live Spotify search</h3><p>Connect your Spotify Premium account in <strong>You → Spotify</strong> to search the live catalog, resolve official artwork and create playlists. The offline collection already contains ${DB.songs.length} style-tagged songs.</p><button class="btn secondary" data-action="navigate" data-id="you">Set up Spotify ${ico('arrow-right')}</button></div>`}`}
function discoveredFiltered(){const q=norm(runtime.query);return allSongs().filter(s=>{if(runtime.cat!=='all'&&s.category!==runtime.cat)return false;if(runtime.genre!=='All'&&(s.genreGroup||s.genre)!==runtime.genre)return false;if(runtime.mood!=='All'&&s.mood!==runtime.mood)return false;if(runtime.energy!=='All'&&s.energy!==runtime.energy)return false;if(runtime.scope==='curated'&&s.source!=='curated')return false;if(runtime.scope==='discovery'&&s.source!=='discovery')return false;if(runtime.scope==='saved'&&!fav(s.id)&&!state.savedDiscoveries.some(t=>t.id===s.id))return false;const cat=byCat(s.category);return !q||norm([s.title,s.artist,s.mood,s.genreGroup,s.meaning,cat?.name,cat?.description,s.caution].join(' ')).includes(q)});}
function discoverResults(){const songs=discoveredFiltered();return `<div class="resultsmeta"><span>${songs.length} songs in this selection</span><span>Style vs. verified lyrics clearly marked</span></div>${songs.length?`<div class="songlist">${songs.slice(0,runtime.exploreLimit).map(songCard).join('')}</div>${songs.length>runtime.exploreLimit?`<button class="btn secondary wide" style="margin-top:14px" data-action="more">Show more (${songs.length-runtime.exploreLimit} left)</button>`:''}`:'<div class="empty">No songs match those filters. Try clearing a filter or changing your mood.</div>'}${runtime.discoveryResults.length?`<section class="section">${sectionHead('Live Spotify results','Track identities and album artwork returned by Spotify')}<div class="songlist">${runtime.discoveryResults.map(songCard).join('')}</div></section>`:''}`}
function getDiscoveryTerm(){return runtime.query.trim()||((runtime.genre==='All')?'rnb soul':runtime.genre)}
function createSpotifySong(t,category='feelgood'){return {id:'sp-'+t.id,title:t.name,artist:(t.artists||[]).map(x=>x.name).join(', '),category,genreGroup:'Unclassified Spotify track',genre:'Spotify catalog',mood:'Not assessed',energy:'Unknown',source:'spotify',meaningStatus:'style',meaning:'Spotify catalog discovery. No lyrical interpretation has been verified; explore it for its sound.',caution:'Lyrics have not been reviewed. Do not interpret this as a verified message.',spotify:t.external_urls?.spotify||`https://open.spotify.com/track/${t.id}`,art:t.album?.images?.[0]?.url||'',spotifyId:t.id,tags:[],yearBand:'Unknown'};}
function uniqueSongs(arr){let seen=new Set();return arr.filter(s=>{const key=norm(s.artist)+'/'+norm(s.title);if(seen.has(key))return false;seen.add(key);return true})}
function classify(s){const g=norm(s.genreGroup||s.genre);if(/afro|amapiano|alte/.test(g))return 'Afrobeats';if(/neo|soul|jazz/.test(g))return 'Neo-soul';if(/r b|rnb/.test(g))return 'R&B';if(/rap|hip hop/.test(g))return 'Hip-hop';return 'Other'}
function similarity(seed,other){const g=seed.map(classify),m=seed.map(x=>x.mood),energy=seed.map(x=>x.energy),ages=seed.map(x=>x.yearBand);let score=0;if(g.includes(classify(other)))score+=5;if(m.includes(other.mood))score+=3;if(energy.includes(other.energy))score+=2;if(ages.includes(other.yearBand))score+=1;if(seed.some(x=>x.artist===other.artist))score+=2;if(seed.some(x=>x.category===other.category))score+=1;return score;}
function mix(){const picked=runtime.mixSeeds.map(byId).filter(Boolean);const rows=allSongs().filter(x=>x.source!=='spotify').filter(s=>!runtime.mixSeeds.includes(s.id));return `${header()}<div class="pagehead"><div class="eyebrow">MIX LAB</div><h1>Two songs. One vibe.</h1><p>Choose 2 or 3 songs and discover other tracks in a related musical lane. Suggestions are based on transparent tags, not Spotify's recommendation engine.</p></div><div class="panel"><div class="sectionlabel">YOUR SEED SONGS · ${picked.length}/3</div><div class="stack" style="margin:13px 0">${picked.length?picked.map(s=>`<div class="seeditem">${coverHTML(s,'cover')}<div class="songdetails"><strong>${esc(s.title)}</strong><small>${esc(s.artist)}</small></div><button class="iconbtn" data-action="removeSeed" data-id="${esc(s.id)}" aria-label="Remove seed">${ico('close')}</button></div>`).join(''):'<div class="emptylist">Add two songs to begin.</div>'}</div><div class="field"><label for="seedSearch">Search the library to add a seed</label><input id="seedSearch" value="${esc(runtime.selectedSeedInput)}" placeholder="Artist or title"/></div><div id="seedMatches" class="hscroll" style="margin:12px 0">${seedMatches()}</div><div class="btnline"><button class="btn" data-action="generateMix" ${picked.length<2?'disabled':''}>${ico('sparkles')} Find similar songs</button><button class="btn secondary" data-action="clearSeeds">Start over</button></div><p class="smallnote">Mixed results can include new curated style picks. With Spotify connected, Mix Lab also searches the live catalog for broader discoveries.</p></div>${runtime.mixResults.length||runtime.mixExtra.length?`<section class="section">${sectionHead('Made for your mix','Each local match uses shared genre, mood or energy tags')}<div class="songlist">${[...runtime.mixResults,...runtime.mixExtra].map(songCard).join('')}</div><div class="btnline" style="margin-top:14px"><button class="btn secondary" data-action="playlistFromMix">${ico('layers')} Create playlist from these</button><button class="btn ghost" data-action="generateMix">${ico('shuffle')} Refresh mix</button></div></section>`:'<div class="empty">Your future recommendations will appear here. Try combining two songs with different styles.</div>'}`}

function generateMessage(s,recipient='Partner',tone='Heartfelt'){const name=state.herName?.trim(),addr=recipient==='Partner'?(name||'love'):recipient==='Friend'?'friend':recipient==='Family'?'you':'you';if(s.meaningStatus==='style'){const m={Gentle:`I thought you might enjoy this ${s.genreGroup||'song'} vibe. It felt right for this moment.`,Heartfelt:`I picked this song because its ${s.mood.toLowerCase()} sound made me think of you.`,Playful:`A little soundtrack for your day — tell me what you think!`,Apology:`I'd love to share this with you, and also talk things through when you're ready.`};return `${m[tone]||m.Heartfelt}\n\n${s.title} — ${s.artist}`}

function explainMix(seeds,s){const parts=[];if(seeds.some(x=>classify(x)===classify(s)))parts.push(classify(s)+' style');if(seeds.some(x=>x.mood===s.mood))parts.push(s.mood.toLowerCase()+' mood');if(seeds.some(x=>x.energy===s.energy))parts.push((s.energy||'').toLowerCase()+' energy');if(seeds.some(x=>x.artist===s.artist))parts.push('same artist');return 'Shared: '+(parts.slice(0,3).join(' · ')||'related curated tags')+'.'}
function localMix(){let seeds=runtime.mixSeeds.map(byId).filter(Boolean);if(seeds.length<2){notify('Select 2 or 3 songs first');return;}runtime.mixResults=allSongs().filter(s=>!runtime.mixSeeds.includes(s.id)).map(s=>({song:s,score:seedScore(s,seeds)})).filter(x=>x.score>=3).sort((a,b)=>b.score-a.score).slice(0,12).map(x=>{x.song.matchNote=explainMix(seeds,x.song);return x.song});runtime.mixExtra=[];render()}
async function generateMix(){localMix();if(!session?.access){notify('Showing similar tracks from your expanded local catalog. Connect Spotify for live discoveries.');return;}runtime.mixBusy=true;try{const seeds=runtime.mixSeeds.map(byId).filter(Boolean),group=classify(seeds[0]),terms={Afrobeats:'afrobeats','R&B':'rnb', 'Neo-soul':'neo soul', 'Hip-hop':'hip hop',Other:'soul'};const searchTerms=[terms[group]||'soul',`artist:"${seeds[seeds.length-1].artist.split(' ft.')[0]}"`];let result=[];for(const query of searchTerms){const data=await spotifySearch(query,10);result.push(...(data.tracks?.items||[]).map(x=>createSpotifySong(x)))}const excluded=new Set(allSongs().filter(x=>runtime.mixSeeds.includes(x.id)||runtime.mixResults.some(z=>z.id===x.id)).map(x=>norm(x.title)+'/'+norm(x.artist)));runtime.mixExtra=uniqueSongs(result).filter(x=>!excluded.has(norm(x.title)+'/'+norm(x.artist))).slice(0,10);runtime.mixExtra.forEach(x=>{x.matchNote='Artist or genre search related to your seeds. Lyrics and actual audio similarity have not been reviewed.';state.resolved[x.id]={id:x.spotifyId,art:x.art,title:x.title,artist:x.artist,at:Date.now()}});render();notify(runtime.mixExtra.length+' live Spotify discoveries added to your mix');}catch(e){notify('Local mix ready. Spotify discovery: '+e.message);}finally{runtime.mixBusy=false}}
function studioList(){const cat=runtime.studioCategory;const pool=allSongs().filter(s=>s.category===cat).concat(allSongs().filter(s=>s.category!==cat&&((byCat(cat)?.name||'').toLowerCase().includes((s.mood||'').toLowerCase())||(classify(s)==='Afrobeats'&&['feelgood','celebrate','roadtrip'].includes(cat))))).filter(s=>runtime.studioSource==='all'||(runtime.studioSource==='curated'?s.source==='curated':s.source==='discovery'));runtime.studioResults=uniqueSongs(pool).slice(0,runtime.studioCount);runtime.studioTitle=`${byCat(cat)?.name||'Your mix'} · Say It With Music`;runtime.tab='studio';render();if(!runtime.studioResults.length)notify('This concept currently has no matching songs. Try All collections.')}

// SPOTIFY WEB API — PKCE: no embedded client secrets, no unverified artwork matching.
const STORE_AUTH='sayit-v3-oauth';
const AUTH_SCOPES='playlist-modify-private playlist-modify-public';
const exactRedirect=()=>location.origin+location.pathname;
function randomString(n){const raw=new Uint8Array(n);crypto.getRandomValues(raw);return [...raw].map(b=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[b%66]).join('')}
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function spotifyLogin(){const cid=(document.getElementById('clientId')?.value||state.clientId||'').trim();if(!/^[a-z0-9]{32}$/i.test(cid)){notify('Enter your valid Spotify Client ID first');return;}if(location.protocol!=='https:'||!crypto.subtle){notify('Spotify login requires the published HTTPS app, not a local HTML preview.');return;}state.clientId=cid;save();const verifier=randomString(64),nonce=randomString(32),codeChallenge=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))),url=exactRedirect();sessionStorage.setItem(STORE_AUTH,JSON.stringify({verifier,nonce,redirect:url,created:Date.now()}));const params=new URLSearchParams({response_type:'code',client_id:cid,redirect_uri:url,code_challenge_method:'S256',code_challenge:codeChallenge,state:nonce,scope:AUTH_SCOPES});location.assign('https://accounts.spotify.com/authorize?'+params)}
async function finishOAuth(){const p=new URLSearchParams(location.search);const code=p.get('code'),error=p.get('error');if(!code&&!error)return;history.replaceState(null,'',location.pathname);if(error){notify('Spotify permission was not granted');return;}let info=oldReadSession(STORE_AUTH,null);sessionStorage.removeItem(STORE_AUTH);if(!info||info.nonce!==p.get('state')||Date.now()-info.created>600000){notify('Spotify sign-in expired. Please try again.');return;}try{const form=new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:info.redirect,client_id:state.clientId,code_verifier:info.verifier});const response=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form});if(!response.ok)throw Error('Spotify rejected the authorization');const tokens=await response.json();session={access:tokens.access_token,refresh:tokens.refresh_token,exp:Date.now()+tokens.expires_in*1000,profile:''};sessionStorage.setItem('sayit-v3-session',JSON.stringify(session));try{const profile=await spotifyFetch('/me');session.profile=profile.display_name||profile.id||'';sessionStorage.setItem('sayit-v3-session',JSON.stringify(session));}catch{}notify('Spotify connected');}catch(e){notify('Spotify connection could not complete: '+e.message)}render()}
async function refreshToken(){if(!session?.refresh||!state.clientId)throw Error('Spotify session expired — reconnect in You');const form=new URLSearchParams({grant_type:'refresh_token',refresh_token:session.refresh,client_id:state.clientId});const response=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form});if(!response.ok){session=null;sessionStorage.removeItem('sayit-v3-session');throw Error('Spotify token expired. Reconnect your account.')}const t=await response.json();session={...session,access:t.access_token,refresh:t.refresh_token||session.refresh,exp:Date.now()+t.expires_in*1000};sessionStorage.setItem('sayit-v3-session',JSON.stringify(session))}
async function spotifyFetch(path,init={}){if(!session?.access)throw Error('Connect Spotify first');if(session.exp<Date.now()+60000)await refreshToken();const result=await fetch('https://api.spotify.com/v1'+path,{...init,headers:{...init.headers,Authorization:'Bearer '+session.access}});if(!result.ok){let text='';try{const err=await result.json();text=err?.error?.message||err?.message||err?.reason||'';if(err?.reason==='QUOTA_EXCEEDED')text='Spotify daily development quota reached';}catch{}if(result.status===429)throw Error(text||'Spotify rate limit reached — try later');if(result.status===401)throw Error('Spotify session expired — reconnect');if(result.status===403)throw Error('Spotify permission denied. Check app access and playlist scopes.');throw Error(text||`Spotify API returned ${result.status}`)}return result.status===204?{}:result.json()}
async function spotifySearch(query,limit=10){return spotifyFetch('/search?'+new URLSearchParams({q:query,type:'track',limit:String(Math.min(limit,10))}));}
function matchScore(t,s){const tn=norm(t.name),sn=norm(s.title);const tArtist=norm((t.artists||[]).map(x=>x.name).join(' '));const sArtist=norm(s.artist).replace(/\bfeat\b|\bft\b/g,' ').trim();let sc=0;if(tn===sn)sc+=6;else if(tn.startsWith(sn)||sn.startsWith(tn))sc+=4;const artTokens=sArtist.split(' ').filter(z=>z.length>2).filter(x=>!['the','and','feat'].includes(x));if(artTokens.length&&artTokens.some(x=>tArtist.includes(x)))sc+=4;else if(sArtist&&tArtist.includes(sArtist.slice(0,8)))sc+=2;return sc}
async function spotifyResolve(s){if(!session?.access)throw Error('Connect Spotify to verify tracks');const old=state.resolved[s.id];if(old?.id&&old.at&&Date.now()-old.at<2*86400000)return old;let track=null;const direct=(s.spotifyId||String(s.spotify||'').match(/\/track\/([a-z0-9]{22})/i)?.[1]);if(direct){try{const candidate=await spotifyFetch('/tracks/'+direct);if(matchScore(candidate,s)>=8)track=candidate;}catch{}}
 if(!track){let data=await spotifySearch(`track:"${s.title.replace(/["']/g,'')}" artist:"${s.artist.split(/\s+(?:feat\.|ft\.|&)/i)[0].replace(/["']/g,'')}"`,10);let items=data.tracks?.items||[];track=items.map(x=>({x,score:matchScore(x,s)})).filter(x=>x.score>=8).sort((a,b)=>b.score-a.score)[0]?.x||null;if(!track){data=await spotifySearch(s.title+' '+s.artist.split(/\s+(?:feat\.|ft\.)/i)[0],10);track=(data.tracks?.items||[]).map(x=>({x,score:matchScore(x,s)})).filter(x=>x.score>=9).sort((a,b)=>b.score-a.score)[0]?.x||null;}}
 if(!track)throw Error('No confirmed Spotify match for '+s.title);const info={id:track.id,art:track.album?.images?.[0]?.url||'',title:track.name,artist:(track.artists||[]).map(x=>x.name).join(', '),at:Date.now()};state.resolved[s.id]=info;save();return info}
function pumpArt(){
 while(artActive<2&&artJobs.length){
  const s=artJobs.shift();artActive++;
  spotifyResolve(s).then(r=>{
   if(!r.art)return;
   document.querySelectorAll(`[data-cover-id="${CSS.escape(s.id)}"]`).forEach(node=>{
    if(node.querySelector('img'))return;
    const img=document.createElement('img');img.loading='lazy';img.alt='Album artwork for '+s.title;img.src=r.art;img.onerror=()=>img.remove();node.appendChild(img);
   });
  }).catch(()=>{}).finally(()=>{pendingArt.delete(s.id);artActive--;pumpArt()});
 }
}
function observeArt(){
 if(coverObserver)coverObserver.disconnect();
 if(!session?.access||!('IntersectionObserver' in window))return;
 coverObserver=new IntersectionObserver(entries=>{
  for(const entry of entries){
   if(!entry.isIntersecting)continue;
   const el=entry.target,id=el.dataset.coverId,s=byId(id);
   coverObserver.unobserve(el);
   if(!s||coverURL(s)||pendingArt.has(id))continue;
   pendingArt.add(id);artJobs.push(s);
  }
  pumpArt();
 },{rootMargin:'220px'});
 document.querySelectorAll('[data-cover-id]').forEach(el=>{if(!coverURL(byId(el.dataset.coverId)||{}))coverObserver.observe(el)});
}
async function liveSearch(){if(!session?.access){navigate('you');notify('Connect Spotify to search beyond the local library.');return;}const term=getDiscoveryTerm();if(!term.trim()){notify('Enter a search phrase first');return;}runtime.discoveryBusy=true;notify('Searching Spotify…');try{const data=await spotifySearch(term,10);runtime.discoveryResults=(data.tracks?.items||[]).filter(x=>x.type==='track').map(t=>createSpotifySong(t));runtime.discoveryResults.forEach(s=>state.resolved[s.id]={id:s.spotifyId,art:s.art,title:s.title,artist:s.artist,at:Date.now()});render();notify(`${runtime.discoveryResults.length} live Spotify results`);}catch(e){notify('Spotify search: '+e.message);}finally{runtime.discoveryBusy=false}}
async function musicRadar(){if(!session?.access){navigate('you');return;}const artists=['Jordan Rakei','Odeal','Xavier Omar','Cleo Sol','RINI','Nonso Amadi','Moonchild','Sango','Jinmi Abduls'];const a=artists[Math.floor(Math.random()*artists.length)];notify('Exploring '+a+'…');try{const data=await spotifySearch('artist:"'+a+'"',10);runtime.radarResults=(data.tracks?.items||[]).filter(t=>t.type==='track').map(t=>createSpotifySong(t,'night'));runtime.radarResults.forEach(s=>state.resolved[s.id]={id:s.spotifyId,art:s.art,title:s.title,artist:s.artist,at:Date.now()});render();notify(`${runtime.radarResults.length} new options from ${a}`)}catch(e){notify('Radar: '+e.message)}}
function listWithHeader(songs,title){return `<div class="resultsmeta"><strong>${esc(title)}</strong><span>${songs.length} songs</span></div><div class="songlist">${songs.map(songCard).join('')}</div>`}
async function publishPlaylist(){if(!session?.access){notify('Connect Spotify in You first');return;}if(!runtime.studioResults.length)return;const title=(runtime.studioTitle||'Say It With Music').trim();if(!title){notify('Enter a playlist name first');return;}if(!confirm(`Create ${runtime.studioPublic?'public':'private'} Spotify playlist "${title}" after verifying the selected tracks? Unmatched songs will be omitted.`))return;let ok=[],fail=[];for(let i=0;i<runtime.studioResults.length;i++){const s=runtime.studioResults[i];notify(`Verifying tracks ${i+1}/${runtime.studioResults.length}…`);try{const r=await spotifyResolve(s);ok.push('spotify:track:'+r.id)}catch(e){fail.push(s.title)}}ok=[...new Set(ok)];if(!ok.length){notify('No track was confidently matched. Nothing was created on Spotify.');return;}if(fail.length&&!confirm(`${ok.length} tracks verified. ${fail.length} unmatched: ${fail.slice(0,5).join(', ')}. Continue with the verified tracks only?`))return;try{const playlist=await spotifyFetch('/me/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:title,public:runtime.studioPublic,description:'A personal soundtrack assembled in Say It With Music.'})});if(!playlist.id)throw Error('No playlist ID received');for(let i=0;i<ok.length;i+=100)await spotifyFetch('/playlists/'+playlist.id+'/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uris:ok.slice(i,i+100)})});const url=playlist.external_urls?.spotify||'https://open.spotify.com/playlist/'+playlist.id;showModal(`<div class="sheethead"><span class="eyebrow">PLAYLIST CREATED</span><button class="iconbtn" data-action="close">${ico('close')}</button></div><div class="panel"><h3>${ico('check')} Your playlist is on Spotify</h3><p>${esc(title)} · ${ok.length} confirmed tracks${fail.length?` · ${fail.length} skipped`:''}</p><button class="btn green" data-action="openUrl" data-url="${esc(url)}">${ico('music')} Open in Spotify</button></div>`)}catch(e){notify('Spotify creation failed: '+e.message)}}
function saveDiscovery(id){const s=byId(id);if(!s||s.source!=='spotify')return;if(!state.savedDiscoveries.some(x=>x.id===id))state.savedDiscoveries.push({...s});save();notify('Added to personal library');showDetail(id)}
function handleInput(e){const id=e.target.id;if(id==='discQuery'){runtime.query=e.target.value;runtime.cat='all';let node=document.getElementById('discoverResults');if(node){node.innerHTML=discoverResults();observeArt()}return;}if(id==='seedSearch'){runtime.selectedSeedInput=e.target.value;document.getElementById('seedMatches').innerHTML=seedMatches();return;}if(id==='privateSongNote'){state.notes[e.target.dataset.id]=e.target.value;save();return;}if(id==='dedicationText'){if(runtime.draftSong){state.drafts[runtime.draftSong]=e.target.value;save()}return;}if(id==='myNickname'){state.herName=e.target.value;save();return;}if(id==='clientId'){state.clientId=e.target.value.trim();save();return;}if(id==='studioName'){runtime.studioTitle=e.target.value;return;}}
function handleChange(e){const id=e.target.id,v=e.target.value;if(id==='genreFilter')runtime.genre=v;else if(id==='moodFilter')runtime.mood=v;else if(id==='energyFilter')runtime.energy=v;else if(id==='sourceFilter')runtime.scope=v;else if(id==='studioCat'){runtime.studioCategory=v;runtime.studioTitle=''}else if(id==='studioCount')runtime.studioCount=Number(v);else if(id==='studioSource')runtime.studioSource=v;else if(id==='studioPublic')runtime.studioPublic=e.target.checked;else if(id==='surpriseMood'){runtime.surpriseMood=v;return;}else if(id==='recipient'||id==='tone'){runtime[id]=v;if(runtime.draftSong){const s=byId(runtime.draftSong),text=generateMessage(s,runtime.recipient,runtime.tone);document.getElementById('dedicationText').value=text;state.drafts[s.id]=text;save()}return;}else if(id==='lightTheme'){state.theme=e.target.checked?'light':'dark';save();render();return;}else if(id==='motionToggle'){state.settings.motion=e.target.checked;save();render();return;}else if(id==='backupFile'){restoreBackup(e.target.files?.[0]);return;}else return;if(runtime.tab==='discover'){runtime.exploreLimit=30;document.getElementById('discoverResults').innerHTML=discoverResults();observeArt()} }
async function restoreBackup(file){if(!file)return;try{const d=JSON.parse(await file.text());let s=d.format==='sayit-v3'?d.state:d.format==='sayit-with-music-v2'?d.state:d;if(!s||!Array.isArray(s.favorites)||!Array.isArray(s.history))throw Error('Invalid backup structure');if(!confirm('Replace your private favorites, notes and drafts with this backup?'))return;state={...state,...s,clientId:state.clientId,resolved:state.resolved,settings:{...state.settings,...(s.settings||{})}};save();render();notify('Backup restored.')}catch(e){notify('Could not import backup: '+e.message)}}
async function action(e){const el=e.target.closest('[data-action]');if(!el)return;const name=el.dataset.action,id=el.dataset.id;e.preventDefault();e.stopPropagation();try{
 if(name==='navigate'){navigate(id);return;}if(name==='allConcepts'){runtime.showAllConcepts=!runtime.showAllConcepts;render();return;}if(name==='category'){categoryNavigate(id);return;}if(name==='close'||name==='backdrop'){if(name==='backdrop'&&e.target!==el)return;closeModal();return;}if(name==='detail'){showDetail(id);return;}if(name==='favorite'){setFavorite(id);return;}if(name==='spotify'){openSpotify(id);return;}if(name==='compose'){compose(id);return;}if(name==='resetFilters'){runtime.query='';runtime.genre='All';runtime.mood='All';runtime.energy='All';runtime.scope='all';runtime.discoveryResults=[];runtime.cat='all';runtime.exploreLimit=24;render();return;}if(name==='applySearch'){runtime.query=document.getElementById('discQuery')?.value||runtime.query;runtime.cat='all';runtime.exploreLimit=100;document.getElementById('discoverResults').innerHTML=discoverResults();observeArt();return;}if(name==='more'){runtime.exploreLimit+=24;document.getElementById('discoverResults').innerHTML=discoverResults();observeArt();return;}if(name==='liveSearch'){await liveSearch();return;}if(name==='musicRadar'){await musicRadar();return;}if(name==='surprise'){const matches=allSongs().filter(s=>runtime.surpriseMood==='All'||norm(s.mood)===norm(runtime.surpriseMood)||norm(byCat(s.category)?.name).includes(norm(runtime.surpriseMood)));let eligible=matches.filter(s=>!state.seen.includes(s.id)),pool=eligible.length?eligible:matches;if(!pool.length)pool=allSongs();const s=pool[Math.floor(Math.random()*pool.length)];state.seen=[...state.seen.slice(-40),s.id];save();showDetail(s.id);return;}if(name==='playlistStudio'){runtime.tab='studio';render();window.scrollTo({top:0,behavior:'instant'});return;}if(name==='addSeed'){if(runtime.mixSeeds.length===3){notify('Remove a seed first (maximum 3)');return;}if(!runtime.mixSeeds.includes(id))runtime.mixSeeds.push(id);runtime.selectedSeedInput='';render();return;}if(name==='removeSeed'){runtime.mixSeeds=runtime.mixSeeds.filter(x=>x!==id);render();return;}if(name==='clearSeeds'){runtime.mixSeeds=[];runtime.mixResults=[];runtime.mixExtra=[];render();return;}if(name==='generateMix'){await generateMix();return;}if(name==='playlistFromMix'){runtime.studioResults=uniqueSongs([...runtime.mixResults,...runtime.mixExtra]);runtime.studioTitle='My Mix Lab · Say It With Music';runtime.tab='studio';render();window.scrollTo({top:0,behavior:'instant'});return;}if(name==='generatePlaylist'){studioList();return;}if(name==='playlistFromSaved'){runtime.studioResults=allSongs().filter(s=>fav(s.id));runtime.studioTitle='My Favorites · Say It With Music';render();return;}if(name==='removePlaylistSong'){runtime.studioResults=runtime.studioResults.filter(x=>x.id!==id);render();return;}if(name==='exportCSV'){exportPlaylistCSV();return;}if(name==='publishPlaylist'){await publishPlaylist();return;}if(name==='saveDiscovery'){saveDiscovery(id);return;}if(name==='login'){await spotifyLogin();return;}if(name==='logout'){session=null;sessionStorage.removeItem('sayit-v3-session');render();notify('Spotify disconnected');return;}if(name==='copyRedirect'){await navigator.clipboard.writeText(exactRedirect());notify('Redirect URI copied');return;}if(name==='exportBackup'){exportBackup();return;}if(name==='importBackup'){document.getElementById('backupFile')?.click();return;}if(name==='addSong'){addSongModal();return;}if(name==='saveCustom'){const title=document.getElementById('newTitle')?.value?.trim(),artist=document.getElementById('newArtist')?.value?.trim(),link=document.getElementById('newSpotify')?.value?.trim(),note=document.getElementById('newMeaning')?.value?.trim();if(!title||!artist){notify('Enter title and artist first');return;}if(link&&!/^https:\/\/open\.spotify\.com\/(?:track|search)\//.test(link)){notify('Use a valid open.spotify.com track/search link');return;}const id='custom-'+Date.now();state.custom.push({id,title,artist,spotify:link||'',category:'feelgood',genre:'Your choice',genreGroup:'Personal',mood:'Personal',energy:'Unknown',meaning:note||'Your private note — no lyrical analysis provided.',meaningStatus:'style',source:'custom',caution:'Personal song; lyrical meaning is not verified.'});save();closeModal();render();notify('Song saved privately');return;}
 if(name==='copyMessage'||name==='share'){const s=byId(id),field=document.getElementById('dedicationText');if(!s||!field)return;const msg=field.value.trim(),url=safeSpotifyURL(s);if(!msg){notify('Write a message before sharing');return;}state.drafts[s.id]=msg;save();const text=msg+'\n\n'+url;if(name==='share'&&navigator.share){try{await navigator.share({title:s.title+' — '+s.artist,text:msg,url});notify('Share sheet opened');}catch(e){if(e.name!=='AbortError')notify('Sharing unavailable. Try Copy instead.')}}else{try{await navigator.clipboard.writeText(text);notify('Message + Spotify link copied');}catch{notify('Copy unavailable on this browser')}}return;}
 if(name==='resetMessage'){const s=byId(id);const text=generateMessage(s,runtime.recipient,runtime.tone);document.getElementById('dedicationText').value=text;state.drafts[id]=text;save();notify('Suggested message refreshed');return;}if(name==='openUrl'){const url=el.dataset.url;if(/^https:\/\/open\.spotify\.com\/playlist\/[a-zA-Z0-9]+/.test(url))location.assign(url);return;}
 }catch(err){console.error(err);notify('Could not complete action: '+(err?.message||'unknown error'));}}
document.addEventListener('click',action);document.addEventListener('input',handleInput);document.addEventListener('change',handleChange);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
