function icon(k){return '<svg class="ico" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(iconPaths[k]||iconPaths.music)+'</svg>'}
const CAT=DATA.categories;
const old=(k,def)=>{try{return JSON.parse(localStorage.getItem('swm_'+k))??def}catch{return def}};
const saveKey='sayit-v2';
function bootState(){let v={favorites:old('favs',[]),history:old('sent',[]).map(id=>({id,date:null,note:'Imported from your previous version.'})),notes:old('notes',{}),custom:old('custom',[]),drafts:{},name:'',herName:'',theme:'dark',clientId:'',art:{}};try{const got=JSON.parse(localStorage.getItem(saveKey));if(got&&typeof got==='object')return {...v,...got}}catch{}return v}
let state=bootState();
const allSongs=()=>DATA.songs.concat(state.custom||[]);
const byId=id=>allSongs().find(s=>s.id===id);
const byCat=id=>CAT.find(c=>c.id===id)||CAT[0];
const isFav=id=>state.favorites.includes(id);
const artistTitle=s=>`${s.artist} — ${s.title}`;
const genreOptions=['All genres','R&B','Neo-soul / Soul','Afrobeats / Afro-R&B','Kizomba / Zouk'];
const moodOptions=['All moods','Tender','Romantic','Longing','Healing','Devoted','Sensual','Playful','Hopeful','Thoughtful','Reassuring','Comforting','Admiring','Dreamy','Joyful'];
let tab='home',category='all',search='',genre='All genres',mood='All moods',intensity='Any intensity',distance=false,safeOnly=false,onlySaved='favorites',sort='curated',limit=30,modal='',activeSong=null,composer=null,toastTimer=null,authBusy=false;
let spotifySession=null,resolveQueue=[],resolveActive=false,coverRequested=new Set(),spotifyProfile='',coverObserver=null;
function persist(){try{localStorage.setItem(saveKey,JSON.stringify(state))}catch{toast('Your phone storage is full. Export a backup.')}}
function notifyClose(){modal='';activeSong=null;composer=null;$('overlay').innerHTML='';document.body.style.overflow=''}
function toast(text){const e=$('toast');e.textContent=text;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3200)}
function album(s,size=''){const c=byCat(s.category),art=state.art?.[s.id]?.url;return `<div class="album ${size}" style="--cover:${esc(c.color)}90" data-cover="${esc(s.id)}" aria-label="Album artwork for ${esc(artistTitle(s))}">${icon('music')}${art?`<img src="${esc(art)}" loading="lazy" alt="Album cover" referrerpolicy="no-referrer">`:''}</div>`}
function catCard(c){const n=allSongs().filter(s=>s.category===c.id).length;return `<button class="concept" style="--cc:${c.color}22;--ci:${c.color}" data-action="cat" data-id="${c.id}"><div class="concept-icon">${icon(c.icon)}</div><div><h3>${esc(c.name)}</h3><small>${n} ${n===1?'song':'songs'}</small></div></button>`}
function songCard(s){const c=byCat(s.category);return `<article class="song">${album(s)}<div class="songmain"><div class="songname">${esc(s.title)}</div><div class="songartist">${esc(s.artist)}</div><div class="tags"><span class="tag">${esc(s.genreGroup||s.genre||'R&B')}</span><span class="tag">${esc(s.mood||'Tender')}</span>${s.distance?'<span class="tag">Long distance</span>':''}</div><p class="songdesc">${esc(s.meaning)}</p>${s.warning?`<div class="warn">${icon('warning')} Lyrics may need a closer look</div>`:''}<div class="songactions"><button class="btn small primary" data-action="compose" data-id="${esc(s.id)}">${icon('send')} Dedicate</button><button class="btn small outline" data-action="detail" data-id="${esc(s.id)}">Meaning</button><button class="btn small outline" data-action="spotify" data-id="${esc(s.id)}" aria-label="Find ${esc(s.title)} on Spotify">Spotify ↗</button><button class="iconbtn ${isFav(s.id)?'active':''}" data-action="fav" data-id="${esc(s.id)}" aria-label="${isFav(s.id)?'Remove from favorites':'Save as favorite'}">${icon(isFav(s.id)?'heart-filled':'heart')}</button></div></div></article>`}
function header(){return `<header class="top"><div class="brand"><span class="brandmark">${icon('heart')}</span><span><strong>Say It With Music</strong><small>EVERY FEELING HAS A SONG</small></span></div><button class="topbtn" data-action="settings" aria-label="Settings">${icon('settings')}</button></header>`}
function nav(){return `<nav class="nav" aria-label="Main navigation">${[['home','home','Home'],['explore','search','Discover'],['saved','heart','Saved'],['story','book','Our story'],['settings','settings','Settings']].map(x=>`<button data-nav="${x[0]}" class="${tab===x[0]?'active':''}" aria-label="${x[2]}">${icon(x[1])}<span>${x[2]}</span></button>`).join('')}</nav>`}
function home(){const featured=['89d25b2c66c2','',DATA.songs[11].id,DATA.songs[34].id].filter(Boolean).map(byId).filter(Boolean);return `<section class="hero"><div class="micro">${icon('heart')} FOR YOUR LONG-DISTANCE LOVE</div><h1>When words fall short,<br><em>let music speak.</em></h1><p>Find a song that says exactly what you feel. Add your own English message, and send it to her from anywhere.</p><div class="row" style="flex-wrap:wrap"><button class="btn primary" data-action="browse">Find the right song ${icon('arrow')}</button><button class="btn secondary" data-action="surprise">${icon('shuffle')} Surprise me</button></div></section><section class="display-card" style="margin-top:18px"><div class="micro">A SONG FOR THIS MOMENT</div><h2 style="font-family:Georgia,serif;font-weight:400;font-size:23px;margin:9px 0 11px">What's on your heart?</h2><input id="feelInput" class="field" type="text" placeholder="e.g. We argued and I miss her..." maxlength="180" aria-label="Describe what you feel"/><div class="row" style="margin-top:10px"><button class="btn primary full" data-action="match">Find my message ${icon('arrow')}</button></div><p class="smallnote">Free, on-device phrase matching. No AI service or personal message is sent to a server.</p></section><div class="sectionline"><div><h2>Choose a moment</h2><p>20 situations made for your relationship.</p></div><button class="linkbtn" data-action="browse">See all ${icon('arrow')}</button></div><div class="concepts">${[CAT[13],CAT[15],CAT[11],CAT[10],CAT[18],CAT[19],CAT[2],CAT[5]].map(catCard).join('')}</div><div class="sectionline"><div><h2>Worth sending today</h2><p>A few thoughtful picks from your collection.</p></div></div>${featured.map(songCard).join('')}<p class="smallnote">Official album covers appear for confirmed Spotify songs. Connect Spotify to identify more tracks; unmatched songs keep a neutral placeholder.</p>`}
function filteredSongs(){let songs=allSongs().filter(s=>(category==='all'||s.category===category));if(genre!=='All genres')songs=songs.filter(s=>(s.genreGroup||'R&B')===genre);if(mood!=='All moods')songs=songs.filter(s=>s.mood===mood);if(intensity!=='Any intensity')songs=songs.filter(s=>s.intensity===intensity);if(distance)songs=songs.filter(s=>s.distance);if(safeOnly)songs=songs.filter(s=>!s.warning);if(search.trim()){let q=ascii(search);songs=songs.filter(s=>ascii([s.title,s.artist,s.meaning,s.genre,s.genreGroup,s.mood,byCat(s.category).name].join(' ')).includes(q))}if(sort==='az')songs.sort((a,b)=>a.title.localeCompare(b.title));if(sort==='favorites')songs.sort((a,b)=>(+isFav(b.id))-(+isFav(a.id)));return songs}
function results(){const list=filteredSongs();return `<div class="sectionmeta"><span id="resultCount">${list.length} ${list.length===1?'song':'songs'} found</span>${category!=='all'?`<button class="linkbtn" data-action="resetFilters">Clear filters</button>`:''}</div><div id="results">${list.length?list.slice(0,limit).map(songCard).join(''):'<div class="mutedbox">No matching song yet. Try a different mood or fewer filters.</div>'}</div>${list.length>limit?`<button class="btn outline full" data-action="more">Show more (${list.length-limit} remaining)</button>`:''}`}
function explore(){let c=category==='all'?null:byCat(category);return `<section class="screenhead"><div class="micro">YOUR MUSIC LIBRARY</div><h1 class="paneltitle">${c?esc(c.name):'Discover your next song'}</h1><p class="subtle">${c?esc(c.description):'Find a song by situation, musical style, mood and intensity.'}</p></section><div class="row" style="margin-top:17px">${icon('search')}<input id="search" value="${esc(search)}" class="field" style="flex:1" placeholder="Search a song, feeling or artist" aria-label="Search songs"/></div><div class="pills" style="margin-top:12px">${`<button class="pill ${category==='all'?'selected':''}" data-action="cat" data-id="all">All moments</button>`+CAT.map(c=>`<button class="pill ${category===c.id?'selected':''}" data-action="cat" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div><div class="filtergrid"><select class="field" id="genreFilter" aria-label="Music genre">${genreOptions.map(g=>`<option ${genre===g?'selected':''}>${esc(g)}</option>`).join('')}</select><select class="field" id="moodFilter" aria-label="Song mood">${moodOptions.map(g=>`<option ${mood===g?'selected':''}>${esc(g)}</option>`).join('')}</select><select class="field" id="intensityFilter" aria-label="Emotional intensity">${['Any intensity','Gentle','Romantic','Bold'].map(g=>`<option ${intensity===g?'selected':''}>${esc(g)}</option>`).join('')}</select><select class="field" id="sortFilter" aria-label="Sort songs">${[['curated','Recommended order'],['az','Song title A–Z'],['favorites','Favorites first']].map(g=>`<option value="${g[0]}" ${sort===g[0]?'selected':''}>${g[1]}</option>`).join('')}</select></div><div class="row" style="flex-wrap:wrap;margin-top:6px"><label class="checkline"><input id="distanceFilter" type="checkbox" ${distance?'checked':''}>Long-distance songs only</label><label class="checkline"><input id="safeFilter" type="checkbox" ${safeOnly?'checked':''}>Hide lyric cautions</label></div><div id="resultArea">${results()}</div>${spotifySession?`<div class="display-card" style="margin-top:14px"><strong>Private Spotify playlist</strong><p class="subtle">Only confirmed Spotify tracks will be included.</p><button class="btn outline full" data-action="makePlaylist">${icon('music')} Create from this selection</button></div>`:''}`}
function saved(){let s=onlySaved==='favorites'?allSongs().filter(x=>isFav(x.id)):onlySaved==='drafts'?allSongs().filter(x=>state.drafts?.[x.id]):allSongs().filter(x=>state.history?.some(h=>h.id===x.id));return `<div class="micro">YOUR PERSONAL COLLECTION</div><h1 class="paneltitle">Saved for the right moment</h1><p class="subtle">Favorites, ready-to-send messages and songs you've shared.</p><div class="pills" style="margin:17px 0">${[['favorites','Favorites'],['drafts','Draft messages'],['sent','Marked as sent']].map(x=>`<button class="pill ${onlySaved===x[0]?'selected':''}" data-action="savedTab" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>${s.length?s.map(songCard).join(''):'<div class="mutedbox">Nothing here yet. Save a song or prepare a dedication to see it here.</div>'}`}
function story(){let a=state.history||[];return `<div class="micro">PRIVATE · STORED ON THIS IPHONE</div><h1 class="paneltitle">Our story in songs</h1><p class="subtle">Your personal timeline of shared songs and memories. Only you can mark a song as sent.</p><div class="display-card" style="margin-top:17px"><div class="row">${icon('book')}<div><strong>Our musical memories</strong><div class="smallnote">${a.length} ${a.length===1?'moment':'moments'} recorded</div></div></div><p class="smallnote">These entries are saved in your browser, not published on GitHub. Export a backup occasionally.</p><button class="btn outline full" data-action="export">${icon('download')} Export personal backup</button></div>${a.length?a.slice().reverse().map((h,i)=>{let s=byId(h.id);return `<div class="storyitem"><small>${h.date?new Date(h.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'Imported from old version'}</small><strong style="display:block;margin-top:5px">${s?esc(artistTitle(s)):'Song no longer in library'}</strong>${h.note?`<p>${esc(h.note)}</p>`:''}${s?`<div class="row"><button class="btn small outline" data-action="detail" data-id="${esc(s.id)}">View song</button><button class="btn small outline" data-action="removeHistory" data-index="${a.length-1-i}">Remove entry</button></div>`:''}</div>`}).join(''):'<div class="mutedbox" style="margin-top:18px">When you send a song, choose “Mark as sent” to save the memory here.</div>'}`}
function settings(){const connected=!!spotifySession;const origin=location.protocol==='https:'?location.origin+location.pathname:'https://skyrimp.github.io/say-it-with-music/';return `<div class="micro">MADE FOR YOUR STORY</div><h1 class="paneltitle">Preferences & connections</h1><p class="subtle">Your customizations and drafts stay on this device.</p><div class="settingsbox"><h3>${icon('heart')} Personal touches</h3><label class="fieldlabel" for="herName">Her first name or nickname (optional)</label><input class="field" id="herName" value="${esc(state.herName||'')}" placeholder="e.g. My love" maxlength="60"><p>Used in the English dedications you prepare. Keep it private.</p><label class="toggle"><span>Light appearance</span><input type="checkbox" id="lightTheme" ${state.theme==='light'?'checked':''}></label></div><div class="settingsbox"><h3>${icon('music')} Spotify Premium</h3><p>${connected?`<span class="conn">Connected${spotifyProfile?' as '+esc(spotifyProfile):''}</span>`:'Not connected. Spotify song links still work without signing in.'}</p><p>For a personal Spotify connection, create an app in Spotify for Developers, then paste its Client ID here. No Client Secret is needed.</p><label class="fieldlabel" for="clientId">Spotify Client ID</label><input class="field" id="clientId" value="${esc(state.clientId||'')}" autocapitalize="off" spellcheck="false" placeholder="32-character Spotify Client ID"><label class="fieldlabel">Exact Redirect URI to add in Spotify Dashboard</label><div class="row"><input class="field" id="redirectUri" readonly value="${esc(origin)}" style="font-size:12px;min-width:0"/><button class="iconbtn" data-action="copyRedirect" aria-label="Copy redirect URL">${icon('copy')}</button></div><div class="row" style="flex-wrap:wrap;margin-top:12px"><a class="btn outline" href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">Spotify developer dashboard ${icon('external-link')}</a>${connected?`<button class="btn outline" data-action="disconnectSpotify">Disconnect</button>`:`<button class="btn primary" data-action="connectSpotify">${icon('music')} Connect Spotify</button>`}</div><p class="smallnote">Development Mode is subject to Spotify's API limits and permissions. Album art is added only after a track match; unverified results keep a neutral cover placeholder.</p></div><div class="settingsbox"><h3>${icon('lock')} Your private data</h3><p>Older favorites and notes were automatically imported if they were available on this same phone and web-app.</p><div class="row" style="flex-wrap:wrap"><button class="btn outline" data-action="export">${icon('download')} Export backup</button><button class="btn outline" data-action="import">${icon('upload')} Restore backup</button></div><input id="importFile" type="file" accept="application/json,.json" hidden><p class="smallnote">Keep backups private; they may contain your nicknames, messages and memories.</p></div><div class="settingsbox"><h3>${icon('plus')} Add your own song</h3><p>Save another song with its meaning and Spotify link, without editing the code.</p><button class="btn secondary full" data-action="addSong">${icon('plus')} Add a song</button></div><p class="smallnote" style="margin:22px 0">Version 2 · 125 curated recommendations · English dedications · No paid AI or data server.</p>`}
function render(){document.documentElement.setAttribute('data-theme',state.theme||'dark');$('app').innerHTML=header()+ (tab==='home'?home():tab==='explore'?explore():tab==='saved'?saved():tab==='story'?story():settings())+nav();if(tab==='home'||tab==='explore'||tab==='saved')observeCovers()}
function navigate(next,catId){tab=next;if(catId!==undefined)category=catId;limit=30;notifyClose();render();window.scrollTo({top:0,behavior:'instant'})}

function messageFor(s,tone,why,extra,name){

  const pre={
    gentle:"This song reminded me of you.",
    heartfelt:"I picked this song for you because the feeling behind it is close to my heart.",
    playful:"I heard this and smiled because it made me think of us.",
    reconcile:"A song can't fix an argument, and I don't want to avoid talking about it."
  }[tone]||"I chose this song for you.";
  const context=dedicationContext[s.category]||"It made me think of you.";
  const ending={
    gentle:"Just wanted to send a little love your way. ♡",
    heartfelt:"Even from far away, I'm grateful you're in my life. ♡",
    playful:"Consider this my way of stealing a little smile from you. ♡",
    reconcile:"When you're ready, I'd love us to talk and really listen to each other. ♡"
  }[tone];
  const reason=String(why||'').trim();const personal=String(extra||'').trim();

}

function redirectUri(){return location.origin+location.pathname}
const KEY_AUTH='sayit-spotify-auth';
function pkceRandom(n=64){const arr=new Uint8Array(n);crypto.getRandomValues(arr);return Array.from(arr,v=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[v%66]).join('')}
function b64url(bytes){return btoa(String.fromCharCode(...bytes)).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_')}
async function spotifyConnect(){const input=$('clientId');const cid=(input?.value||state.clientId||'').trim();if(!/^[a-z0-9]{32}$/i.test(cid)){toast('Paste your 32-character Spotify Client ID first');return}if(location.protocol!=='https:'){toast('Spotify login requires your published HTTPS site');return}if(!crypto.subtle){toast('Secure login unavailable in this browser');return}state.clientId=cid;persist();const ver=pkceRandom(64),nonce=pkceRandom(20);const hash=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));localStorage.setItem(KEY_AUTH,JSON.stringify({ver,nonce,at:Date.now(),redirect:redirectUri()}));const p=new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:redirectUri(),code_challenge_method:'S256',code_challenge:b64url(hash),state:nonce,scope:'user-read-private playlist-modify-private'});location.assign('https://accounts.spotify.com/authorize?'+p.toString())}
async function finishOAuth(){const params=new URLSearchParams(location.search);const code=params.get('code'),err=params.get('error');if(!code&&!err)return;history.replaceState(null,'',location.pathname+location.hash);if(err){toast('Spotify authorization was cancelled or declined');return}let info;try{info=JSON.parse(localStorage.getItem(KEY_AUTH)||'null')}catch{}localStorage.removeItem(KEY_AUTH);if(!info||info.nonce!==params.get('state')||Date.now()-info.at>12*60000||!state.clientId){toast('Spotify session expired. Please connect again.');return}try{const body=new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:info.redirect,client_id:state.clientId,code_verifier:info.ver});const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!r.ok)throw Error('Spotify did not accept the code');const t=await r.json();spotifySession={access:t.access_token,exp:Date.now()+t.expires_in*1000};sessionStorage.setItem('sayit-spotify-token',JSON.stringify(spotifySession));try{const p=await spotifyApi('/me');spotifyProfile=p.display_name||p.id||''}catch{}coverRequested.clear();toast('Spotify connected');render()}catch(e){toast('Spotify connection failed: '+String(e.message).slice(0,65))}}
async function spotifyApi(path,opts={}){if(!spotifySession||Date.now()>spotifySession.exp-5000)throw Error('Spotify session expired. Reconnect in Settings.');const r=await fetch('https://api.spotify.com/v1'+path,{...opts,headers:{Authorization:'Bearer '+spotifySession.access,'Content-Type':'application/json',...opts.headers}});if(!r.ok){if(r.status===429)throw Error('Spotify API limit reached. Try again later.');if(r.status===403)throw Error('Spotify has not authorized this action in Development Mode.');if(r.status===401){spotifySession=null;throw Error('Spotify session expired. Reconnect.')}throw Error('Spotify error '+r.status)}return r.status===204?{}:r.json()}

function observeCovers(){
  if(coverObserver){coverObserver.disconnect();coverObserver=null}
  const elements=[...document.querySelectorAll('.album[data-cover]')];
  const add=e=>{const id=e.dataset.cover;if(!id)return;
    if(state.art?.[id]?.url){paintCover(id);return}
    if(coverRequested.has(id))return;
    const song=byId(id);
    if(song&&(spotifySession||song.direct)){
      coverRequested.add(id);resolveQueue.push(song);drainResolve();
    }
  };
  if('IntersectionObserver' in window){
    coverObserver=new IntersectionObserver(entries=>{
      for(const entry of entries)if(entry.isIntersecting){add(entry.target);coverObserver.unobserve(entry.target)}
    },{rootMargin:'200px'});
    elements.forEach(e=>coverObserver.observe(e));
  }else elements.slice(0,16).forEach(add);
}

document.addEventListener('change',async e=>{const t=e.target;
if(t.id==='genreFilter'){genre=t.value;refreshResults()}if(t.id==='moodFilter'){mood=t.value;refreshResults()}if(t.id==='intensityFilter'){intensity=t.value;refreshResults()}if(t.id==='sortFilter'){sort=t.value;refreshResults()}if(t.id==='distanceFilter'){distance=t.checked;refreshResults()}if(t.id==='safeFilter'){safeOnly=t.checked;refreshResults()}if(t.id==='lightTheme'){state.theme=t.checked?'light':'dark';persist();render()}
if(t.id==='importFile'){const file=t.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());let candidate=data?.format==='sayit-with-music-v2'?data.state:data;if(candidate&&Array.isArray(candidate.favs)&&Array.isArray(candidate.sent)){candidate={...state,favorites:candidate.favs,history:candidate.sent.map(id=>({id,date:null,note:'Imported from version 1 backup.'})),notes:candidate.notes||{},custom:candidate.custom||[],drafts:{}}}if(!candidate||!Array.isArray(candidate.favorites)||!Array.isArray(candidate.history)||typeof candidate.notes!=='object')throw Error();if(!confirm('Replace your private favorites, dedications and story with this backup?'))return;state={...state,...candidate,clientId:state.clientId,art:state.art};persist();render();toast('Backup restored')}catch{toast('This backup file could not be read')}}
});
document.addEventListener('submit',e=>{if(e.target.id!=='addForm')return;e.preventDefault();const f=new FormData(e.target);let title=String(f.get('title')||'').trim(),artist=String(f.get('artist')||'').trim(),meaning=String(f.get('meaning')||'').trim(),category=String(f.get('category')),g=String(f.get('genre')),m=String(f.get('mood')),url=String(f.get('url')||'').trim();if(!title||!artist||!meaning)return;if(url&&!/^https:\/\/open\.spotify\.com\/track\/[A-Za-z0-9]+(\?.*)?$/.test(url)){toast('Invalid Spotify track URL; search link used instead');url=''}const s={id:'own-'+Date.now().toString(36),title,artist,meaning,category,genre:g,genreGroup:g,mood:m,intensity:'Romantic',distance:category==='c04'||category==='c16'||category==='c19'||category==='c20',spotify:url||'https://open.spotify.com/search/'+encodeURIComponent(title+' '+artist),direct:!!url,warning:false,custom:true};state.custom.push(s);persist();notifyClose();navigate('explore',category);toast('Your song is in the library')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')notifyClose()});
document.addEventListener('error',e=>{if(e.target?.matches?.('.album img'))e.target.remove()},true);
try{const s=JSON.parse(sessionStorage.getItem('sayit-spotify-token')||'null');if(s?.access&&s.exp>Date.now()+10000)spotifySession=s}catch{}
render();finishOAuth();

</script></body></html>
